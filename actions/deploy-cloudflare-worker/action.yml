name: Deploy Cloudflare Worker
description: Deploy a Cloudflare Worker and replace its secrets.
inputs:
  secrets:
    description: Comma-separated or newline-separated environment variable names to upload.
    required: true
  working-directory:
    description: Directory containing the Worker and its installed Wrangler package.
    required: false
    default: .
  entrypoint:
    description: Worker entrypoint or assets path. Wrangler uses the configured entrypoint when omitted.
    required: false
    default: ""
  worker-name:
    description: Worker name. Wrangler uses the configured name when omitted.
    required: false
    default: ""
  environment:
    description: Wrangler environment to target.
    required: false
    default: ""
  config:
    description: Path to a Wrangler configuration file, relative to the working directory.
    required: false
    default: ""
  minify:
    description: Minify the bundled Worker before deploying.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Deploy Worker
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_ENTRYPOINT: ${{ inputs.entrypoint }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_MINIFY: ${{ inputs.minify }}
        INPUT_WORKER_NAME: ${{ inputs.worker-name }}
      run: bash "$ACTION_PATH/entrypoint.sh"

    - name: Upload Secrets
      uses: $/actions/upload-worker-secrets
      with:
        secrets: ${{ inputs.secrets }}
        working-directory: ${{ inputs.working-directory }}
        worker-name: ${{ inputs.worker-name }}
        environment: ${{ inputs.environment }}
        config: ${{ inputs.config }}
