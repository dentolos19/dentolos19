name: Deploy Fly App
description: Deploy a Fly app and apply its Machine scaling configuration.
inputs:
  working-directory:
    description: Directory containing the Fly app and its configuration.
    required: false
    default: .
  app:
    description: Fly app name. Flyctl uses the configured app when omitted.
    required: false
    default: ""
  config:
    description: Path to a Fly configuration file, relative to the working directory.
    required: false
    default: ""
  flyctl-version:
    description: Flyctl version to install.
    required: false
    default: latest
  strategy:
    description: Deployment strategy.
    required: false
    default: immediate
  high-availability:
    description: Create spare Machines during deployment.
    required: false
    default: "false"
  machine-count:
    description: Target number of Machines after deployment.
    required: false
    default: "1"
  process-group:
    description: Process group to scale. The default process group is used when omitted.
    required: false
    default: ""
  regions:
    description: Comma-separated regions across which to distribute the target Machine count.
    required: false
    default: ""
  max-per-region:
    description: Maximum number of Machines allowed in each selected region.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Setup Flyctl
      uses: superfly/flyctl-actions/setup-flyctl@v1
      with:
        version: ${{ inputs.flyctl-version }}

    - name: Deploy And Scale App
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_APP: ${{ inputs.app }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_HIGH_AVAILABILITY: ${{ inputs.high-availability }}
        INPUT_MACHINE_COUNT: ${{ inputs.machine-count }}
        INPUT_MAX_PER_REGION: ${{ inputs.max-per-region }}
        INPUT_PROCESS_GROUP: ${{ inputs.process-group }}
        INPUT_REGIONS: ${{ inputs.regions }}
        INPUT_STRATEGY: ${{ inputs.strategy }}
      run: bash "$ACTION_PATH/entrypoint.sh"
