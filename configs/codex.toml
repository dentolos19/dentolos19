#:schema https://developers.openai.com/codex/config-schema.json

model = "gpt-6.1-sol"
model_reasoning_effort = "high"
model_verbosity = "low"
service_tier = "default"
sandbox_mode = "danger-full-access"
approval_policy = "never"

[desktop]
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "max", "ultra"]
selected-avatar-id = "custom:dennise"
avatar-overlay-mascot-width-px = 80
sidebar-show-projects-in-recents = false
sidebarShowYourDotInRecents = false
preventSleepWhileRunning = true
keepRemoteControlAwakeWhilePluggedIn = true
git-commit-instructions = "Describe commit messages as past-tense actions, such as `Added README.md` or `Updated authentication system`."
git-pr-instructions = "Write PR titles as a feature or a fix, like `Case Region Improvements` or `Agentic Integration`. For PR descriptions, include a summary section with a overview of the PR, and then the changes section listing the specific modifications."

[desktop.appearanceLightChromeTheme.fonts]
code = '"JetBrainsMono Nerd Font Mono"'

[desktop.appearanceDarkChromeTheme.fonts]
code = '"JetBrainsMono Nerd Font Mono"'

[agents]
enabled = true
default_subagent_model = "gpt-6.1-terra"
default_subagent_reasoning_effort = "max"
max_concurrent_threads_per_session = 10

[memories]
use_memories = true
generate_memories = true
extract_model = "gpt-6-luna"
consolidation_model = "gpt-6.1-terra"

[features.multi_agent_v2]
enabled = true
wait_agent_enabled = true
default_wait_timeout_ms = 1800000
min_wait_timeout_ms = 600000
max_wait_timeout_ms = 3600000

[mcp_servers.composio]
url = "https://connect.composio.dev/mcp"

[mcp_servers."1password"]
enabled = true
command = "1password-mcp"

[mcp_servers.gitkraken]
enabled = true
command = "gk"
args = ["mcp"]

[mcp_servers.playwright]
enabled = true
command = "bunx"
args = ["--bun", "@playwright/mcp"]

[marketplaces.ponytail]
source_type = "git"
source = "https://github.com/DietrichGebert/ponytail.git"

[plugins."ponytail@ponytail"]
enabled = true
