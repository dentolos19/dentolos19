#:schema https://developers.openai.com/codex/config-schema.json

model = "gpt-6-sol"
review_model = "gpt-6-astra"
model_verbosity = "low"
model_reasoning_effort = "low"
# plan_mode_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[desktop]
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "max", "ultra"]
selected-avatar-id = "custom:dennise"
avatar-overlay-mascot-width-px = 120
git-commit-instructions = "Write commit messages as past-tense actions, such as `Added README.md` or `Updated authentication system`."
preventSleepWhileRunning = true

[desktop.appearanceLightChromeTheme.fonts]
code = '"JetBrainsMono Nerd Font Mono"'

[desktop.appearanceDarkChromeTheme.fonts]
code = '"JetBrainsMono Nerd Font Mono"'

[agents]
enabled = true
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "max"
max_concurrent_threads_per_session = 10

[features.multi_agent_v2]
enabled = true
wait_agent_enabled = true
default_wait_timeout_ms = 1800000
min_wait_timeout_ms = 600000
max_wait_timeout_ms = 3600000

[mcp_servers.composio]
url = "https://connect.composio.dev/mcp"

[mcp_servers."1password"]
enabled = true
command = "1password-mcp"

[mcp_servers.gitkraken]
enabled = true
command = "gk"
args = ["mcp"]

[mcp_servers.playwright]
enabled = true
command = "bunx"
args = ["--bun", "@playwright/mcp"]

[mcp_servers.blender]
enabled = true
command = "uvx"
args = ["blender-mcp"]

[marketplaces.ponytail]
source_type = "git"
source = "https://github.com/DietrichGebert/ponytail.git"

[marketplaces.pstack-for-codex-local]
source_type = "git"
source = "https://github.com/Aqua-123/pstack-for-codex.git"

[plugins."ponytail@ponytail"]
enabled = true

[plugins."pstack-for-codex@pstack-for-codex-local"]
enabled = true
