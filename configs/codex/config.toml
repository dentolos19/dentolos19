#:schema https://developers.openai.com/codex/config-schema.json

model = "gpt-5.6-sol"
review_model = "gpt-5.6-sol"
model_verbosity = "low"
model_reasoning_effort = "low"
plan_mode_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[desktop]
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "max", "ultra"]
selected-avatar-id = "custom:dennise"
avatar-overlay-mascot-width-px = 120
git-commit-instructions = "Write commit messages as past-tense actions, such as `Added README.md` or `Updated authentication system`."

[desktop.appearanceLightChromeTheme.fonts]
code = '"JetBrainsMono Nerd Font Mono"'

[desktop.appearanceDarkChromeTheme.fonts]
code = '"JetBrainsMono Nerd Font Mono"'

[agents]
enabled = true
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "high"

[model_providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
wire_api = "responses"
http_headers = { "Authorization" = "Bearer {env:OPENROUTER_API_KEY}" }
requires_openai_auth = false
supports_websockets = false

[mcp_servers.monolith]
enabled = true
url = "https://mcp.dennise.dev/mcp"
http_headers = { "CF-Access-Client-Id" = "{env:CLOUDFLARE_CLIENT_ID}", "CF-Access-Client-Secret" = "{env:CLOUDFLARE_CLIENT_SECRET}" }

[mcp_servers.gitkraken]
enabled = true
command = "gk"
args = ["mcp"]

[mcp_servers."1password"]
enabled = true
command = "1password-mcp"

[marketplaces.ponytail]
source_type = "git"
source = "https://github.com/DietrichGebert/ponytail.git"

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."ponytail@ponytail"]
enabled = true
