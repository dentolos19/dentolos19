name: Clean Workflows
run-name: "Clean Workflows #${{ github.run_number }}"
on:
  schedule:
    - cron: "0 13 * * 0"
  workflow_dispatch:
    inputs:
      retain_days:
        description: "Retain runs from the last N days (0 disables age protection)."
        type: number
        required: true
        default: 7
      minimum_runs:
        description: "Keep at least N latest completed runs per workflow (0 disables count protection)."
        type: number
        required: true
        default: 0
      dry_run:
        description: "Preview eligible runs without deleting them."
        type: boolean
        default: false
jobs:
  discover:
    name: Discover My Repositories
    runs-on: ubuntu-latest
    outputs:
      repositories: ${{ steps.discover.outputs.repositories }}
      repository_count: ${{ steps.discover.outputs.repository_count }}
    steps:
      - name: Discover Repositories
        id: discover
        uses: actions/github-script@v7
        env:
          CLEAN_WORKFLOWS_TOKEN: ${{ secrets.CLEAN_WORKFLOWS_TOKEN }}
        with:
          github-token: ${{ secrets.CLEAN_WORKFLOWS_TOKEN }}
          script: |
            if (!process.env.CLEAN_WORKFLOWS_TOKEN) {
              throw new Error("Set the CLEAN_WORKFLOWS_TOKEN repository secret before running cleanup.");
            }

            const owner = context.repo.owner.toLowerCase();
            const repositories = await github.paginate(
              github.rest.repos.listForAuthenticatedUser,
              { per_page: 100, affiliation: "owner,collaborator,organization_member", sort: "full_name" }
            );

            const filteredRepositories = repositories
              .filter((repository) =>
                !repository.archived &&
                !repository.disabled &&
                (repository.owner.login.toLowerCase() === owner ||
                  repository.permissions?.admin || repository.permissions?.maintain)
              )
              .map((repository) => repository.full_name);

            core.info(`Found ${filteredRepositories.length} owned or maintained repositories.`);
            core.setOutput("repositories", JSON.stringify(filteredRepositories));
            core.setOutput("repository_count", String(filteredRepositories.length));

  delete:
    if: ${{ needs.discover.outputs.repository_count != '0' }}
    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJson(needs.discover.outputs.repositories) }}
    needs: discover
    name: Delete Workflow Runs
    runs-on: ubuntu-latest
    steps:
      - name: Delete Runs
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          MINIMUM_RUNS: ${{ inputs.minimum_runs }}
          REPOSITORY: ${{ matrix.repository }}
          RETAIN_DAYS: ${{ inputs.retain_days }}
        with:
          github-token: ${{ secrets.CLEAN_WORKFLOWS_TOKEN }}
          script: |
            const [owner, repo] = process.env.REPOSITORY.split("/");
            const retainDays = Number(process.env.RETAIN_DAYS || "7");
            const keepMinimumRuns = Number(process.env.MINIMUM_RUNS || "0");
            const dryRun = process.env.DRY_RUN === "true";
            if (!Number.isSafeInteger(retainDays) || retainDays < 0 ||
                !Number.isSafeInteger(keepMinimumRuns) || keepMinimumRuns < 0) {
              throw new Error("Retention days and minimum runs must be nonnegative whole numbers.");
            }
            const cutoff = Date.now() - retainDays * 24 * 60 * 60 * 1000;
            core.info(`Retain days: ${retainDays}; minimum runs per workflow: ${keepMinimumRuns}; dry run: ${dryRun}.`);

            // Snapshot all pages before deletion; unfiltered listing avoids the 1,000-result search limit.
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 }
            );
            const completedRuns = runs
              .filter((run) => run.status === "completed")
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at) || b.id - a.id);
            const counts = new Map();

            for (const run of completedRuns) {
              const count = (counts.get(run.workflow_id) || 0) + 1;
              counts.set(run.workflow_id, count);
              if (count <= keepMinimumRuns || !(Date.parse(run.created_at) < cutoff)) continue;

              if (dryRun) {
                core.info(`Would delete ${owner}/${repo} run ${run.id}.`);
              } else {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                core.info(`Deleted ${owner}/${repo} run ${run.id}.`);
              }
            }
